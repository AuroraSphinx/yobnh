<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000; color: #fff;
      font-family: "Cascadia Mono", "Consolas", monospace;
      display: flex; flex-direction: column; overflow: hidden;
    }

    #term { flex: 1; min-height: 0; background: #000; }
    #term .xterm { height: 100%; padding: 8px; }

    #bottombar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px; border-top: 1px solid #333; font-size: 12px; color: #888;
    }
    #bottombar .status { color: #fff; }
    #bottombar .status.off { color: #888; }
  </style>
</head>
<body>
  <div id="term">
    <div id="terminal"></div>
  </div>

  <div id="bottombar">
    <span>terminal</span>
    <span class="status off" id="connStatus">CONNECTING...</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script>
    const connStatus = document.getElementById('connStatus');
    let term, fit, ws;

    term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: '"Cascadia Mono","Consolas",monospace',
      theme: {
        background: '#000000', foreground: '#ffffff', cursor: '#ffffff', cursorAccent: '#000000'
      }
    });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('terminal'));
    term.writeln('Connecting to VPS...');
    fit.fit();

    function setStatus(text, on) {
      connStatus.textContent = text;
      connStatus.className = 'status' + (on ? '' : ' off');
    }

    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'data') {
        term.write(m.text);
      } else if (m.type === 'status') {
        term.writeln(m.text);
      }
    };
    ws.onclose = () => {
      setStatus('DISCONNECTED', false);
    };
    ws.onerror = () => {
      setStatus('CONNECTION ERROR', false);
    };

    ws.onopen = () => {
      setStatus('CONNECTED', true);
      fit.fit();
      ws.send(JSON.stringify({ type: 'resize', rows: term.rows, cols: term.cols, height: 0, width: 0 }));
    };

    term.onData((data) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'input', text: data }));
      }
    });

    window.addEventListener('resize', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        fit.fit();
        ws.send(JSON.stringify({ type: 'resize', rows: term.rows, cols: term.cols, height: 0, width: 0 }));
      }
    });
  </script>
</body>
</html>
